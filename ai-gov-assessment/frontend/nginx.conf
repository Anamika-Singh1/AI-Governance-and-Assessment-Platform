server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy keeps deployment URLs and session cookies out of
  # browser configuration while avoiding cross-origin authentication issues.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback: any path that isn't a real static file goes to
  # index.html so React Router's client-side routes (e.g. /assessments/:id)
  # work on a hard refresh, not just on in-app navigation.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets are content-hashed by Vite, so they're safe to cache
  # aggressively; index.html itself is not (it must always be revalidated
  # to pick up a new deploy).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
